name: Aetherion AVTA tests

on:
  pull_request:
    paths:
      - "aetherion_verifier/**"
      - "tests/test_aetherion_verifier.py"
      - ".github/workflows/aetherion-avta.yml"
  push:
    branches:
      - "feat/aetherion-verifiable-attestations-v1"
    paths:
      - "aetherion_verifier/**"
      - "tests/test_aetherion_verifier.py"
      - ".github/workflows/aetherion-avta.yml"

jobs:
  avta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install crypto test dependency
        run: python -m pip install --upgrade cryptography
      - name: Run AVTA tests
        run: python -m unittest discover -s tests -p "test_aetherion_*.py" -v
