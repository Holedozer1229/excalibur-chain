# Scrape the local Excalibur full node. The node's metrics listener is bound
# to loopback by default and should not be exposed to the public internet.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: excalibur_node
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9435"]
        labels:
          network: excal-fork
          component: full-node-p2p

# For remote monitoring, add node metrics targets only over a secured
# management network/VPN. Do not bind EXCAL_PROMETHEUS_HOST to a public
# interface or expose TCP 9435 to the internet.
